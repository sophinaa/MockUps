<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viva Runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{--bg:#FFFFFF;--ink:#535353;--soft:#C8C8C8}
  *{box-sizing:border-box}
  html,body{background:var(--bg)}
  body{margin:0;color:var(--ink);font-family:"Press Start 2P",ui-monospace,Menlo,Consolas,monospace;display:flex;justify-content:center;min-height:100vh;padding:48px 16px}
  .wrap{width:100%;max-width:820px}

  .qpanel{min-height:176px;margin-bottom:22px}
  .card{border:3px solid var(--ink);padding:14px 16px;background:#fff}
  .idle{border:none;text-align:center;font-size:11px;line-height:2.1;padding-top:34px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;font-size:10px}
  .bar{flex:0 1 200px;height:12px;border:3px solid var(--ink)}
  .bar i{display:block;height:100%;background:var(--ink)}
  .q{font-size:12px;line-height:1.9;margin:0 0 6px}
  .code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:#777;margin-bottom:12px}
  .opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .opt{font:inherit;font-size:10px;line-height:1.7;text-align:left;min-height:48px;padding:8px 10px;border:3px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;display:flex;gap:10px;align-items:center}
  .opt:hover{background:#F1F1F1}
  .opt:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
  .opt b{flex:0 0 auto;width:22px;height:22px;display:flex;align-items:center;justify-content:center;background:var(--ink);color:#fff;font-weight:normal}
  .opt.right{background:var(--ink);color:#fff}.opt.right b{background:#fff;color:var(--ink)}
  .opt.wrong{text-decoration:line-through;color:#999;border-style:dashed}
  .opt:disabled{cursor:default}
  .verdict{margin-top:12px;font-size:10px;min-height:14px}
  @media (max-width:640px){.opts{grid-template-columns:1fr}}

  canvas{display:block;width:100%;height:auto;cursor:pointer;image-rendering:pixelated}
  .term{margin-top:28px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.7;color:#8A8A8A;min-height:66px}
  .term .on{color:var(--ink);font-weight:600}
  .foot{margin-top:18px;font-size:9px;line-height:2;color:#9A9A9A;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="qpanel" id="qpanel"></div>
  <canvas id="c" width="820" height="230" aria-label="Viva Runner game"></canvas>
  <div class="term" id="term"></div>
  <div class="foot">SPACE TO START · 1 2 3 TO ANSWER<br>RIGHT ANSWER = JUMP · WRONG ANSWER = NO PUSH</div>
</div>

<script>
(function(){
  var QUESTIONS = [
    { q: "First attempt charges the card, then times out. What happens on the retry?",
      code: "chargeCard()  →  then ledger.seen()",
      opts: ["Card is charged twice", "Check blocks the retry", "Webhook gives up"], a: 0 },
    { q: "The agent added a 5s timeout. When it fires, what happens at the bank?",
      code: "withTimeout(chargeCard(...), 5_000)",
      opts: ["Charge is cancelled", "Charge may still go through", "Charge is refunded"], a: 1 },
    { q: "MAX_RETRIES is 3. Most times this can call chargeCard?",
      code: "for (attempt = 1; attempt <= MAX_RETRIES; attempt++)",
      opts: ["2", "4", "3"], a: 2 }
  ];

  var INK='#535353', SOFT='#C8C8C8', PS=3; // pixel size
  var FONT='"Press Start 2P", ui-monospace, Menlo, monospace';
  var cv=document.getElementById('c'), ctx=cv.getContext('2d');
  var W=cv.width, H=cv.height, GROUND=196, PX=70;
  var WALLS=[1100,2300,3500], FINISH=4300, ASK_AT=740;
  var FAST=4.8, SLOW=1.15;
  var st, last, hi=0;
  try { hi = +localStorage.getItem('vivaHi') || 0; } catch(e) {}

  // ---------- sprites (# = ink, + = soft) ----------
  var BOX = ["############","#..........#","#..##..##..#","#..##..##..#","#..........#","#....##....#","#..........#","############"];
  var BOX_DEAD = ["############","#..........#","#.#.#..#.#.#","#..#....#..#","#.#.#..#.#.#","#...####...#","#..........#","############"];
  var LEGS = [[".##......##.",".##........."],[".##......##.",".........##."],[".##......##.",".##......##."]];
  var FOG = [
    ".....######.....",
    "...##......##...",
    "..#..........#..",
    ".#....####....#.",
    "#....##..##....#",
    "#.........##...#",
    ".#.......##...#.",
    "#........##....#",
    "#..............#",
    ".#.......##...#.",
    "#........##....#",
    "#..............#",
    ".#............#.",
    "#..............#",
    "################"];
  var CLOUD = ["....+++++.....","..++.....++...",".+.........+++","++++++++++++++"];
  var FLAG = ["##############","#............#","#............#","#............#","#............#","##############","#.............","#.............","#.............","#.............","#.............","#.............","#.............","#.............","#............."];

  function sprite(rows, x, y, s, dither){
    s=s||PS;
    for (var r=0;r<rows.length;r++) for (var c=0;c<rows[r].length;c++){
      var ch=rows[r][c]; if (ch==='.') continue;
      if (dither && ((r+c)%2===0)) continue;
      ctx.fillStyle = ch==='+' ? SOFT : INK;
      ctx.fillRect(Math.round(x+c*s), Math.round(y+r*s), s, s);
    }
  }

  var term=document.getElementById('term');
  function setTerm(lines){ term.innerHTML = lines.map(function(l){ return '<div class="'+(l[0]||'')+'"></div>'; }).join('');
    for (var i=0;i<lines.length;i++) term.children[i].textContent = lines[i][1]; }
  function idle(html){ document.getElementById('qpanel').innerHTML='<div class="idle">'+html+'</div>'; }

  function reset(){
    st={ mode:'ready', world:0, y:0, vy:0, frame:0, speed:FAST,
         asked:[false,false,false], armed:[false,false,false], doomed:[false,false,false], gone:[0,0,0],
         active:-1, why:'', clouds:[{x:160,y:40},{x:470,y:70},{x:720,y:30}] };
    setTerm([['','$ git push origin main'],['on','viva ▸ the agent made 3 changes you never asked for. Explain them or nothing gets pushed.']]);
    idle('YOUR COMMIT IS RUNNING FOR MAIN.<br>3 FOG WALLS STAND IN THE WAY.');
    draw();
  }

  function start(){
    if (st.mode==='crash'||st.mode==='done') reset();
    if (st.mode!=='ready') return;
    st.mode='run'; idle('KEEP RUNNING…'); last=performance.now(); requestAnimationFrame(loop);
  }

  function loop(t){ var dt=Math.min(2.5,(t-last)/16.67); last=t; update(dt); draw(); if (st.mode==='run') requestAnimationFrame(loop); }
  function wallX(j){ return WALLS[j]-st.world+PX; }
  function score(){ return Math.floor(st.world/10); }

  function update(dt){
    st.frame+=dt;
    var a=st.active, target=FAST;
    if (a>=0 && !st.armed[a] && !st.doomed[a]) target=SLOW;
    if (a>=0 && st.doomed[a]) target=FAST*1.4;
    st.speed += (target-st.speed)*Math.min(1,0.12*dt);
    st.world += st.speed*dt;
    if (st.vy!==0||st.y>0){ st.y+=st.vy*dt; st.vy-=0.6*dt; if (st.y<=0){ st.y=0; st.vy=0; } }
    st.clouds.forEach(function(c){ c.x-=0.25*st.speed*dt; if (c.x<-60) c.x=W+Math.random()*140; });
    for (var j=0;j<3;j++){
      var gap=wallX(j)-PX;
      if (!st.asked[j] && gap<ASK_AT) ask(j);
      if (st.active===j) bar(gap);
      if (st.armed[j] && gap<PX) st.gone[j]=Math.min(1, st.gone[j]+0.03*dt);
      if (gap<40 && gap>-48){
        if (st.armed[j]){ if (st.y===0 && gap>0) st.vy=13.5; }
        else if (st.y<90){ crash(st.doomed[j]?'wrong':'slow'); return; }
      }
    }
    if (FINISH-st.world<6) finish();
  }

  function ask(j){
    st.asked[j]=true; st.active=j;
    var Q=QUESTIONS[j], p=document.getElementById('qpanel');
    p.innerHTML='<div class="card"><div class="row"><span>FOG WALL '+(j+1)+'/3</span><span class="bar"><i id="bar" style="width:100%"></i></span></div>'+
      '<p class="q"></p><div class="code"></div><div class="opts" id="opts"></div><div class="verdict" id="verdict"></div></div>';
    p.querySelector('.q').textContent=Q.q; p.querySelector('.code').textContent=Q.code;
    var box=document.getElementById('opts');
    Q.opts.forEach(function(o,k){
      var b=document.createElement('button'); b.className='opt'; b.type='button';
      b.innerHTML='<b>'+(k+1)+'</b><span></span>'; b.lastChild.textContent=o;
      b.onclick=function(){ answer(k); }; box.appendChild(b);
    });
  }
  function bar(gap){ var b=document.getElementById('bar'); if (b) b.style.width=Math.max(0,Math.min(100,(gap-40)/(ASK_AT-40)*100))+'%'; }

  function answer(k){
    var j=st.active; if (j<0||st.mode!=='run'||st.armed[j]||st.doomed[j]) return;
    var Q=QUESTIONS[j], btns=document.getElementById('opts').children, v=document.getElementById('verdict');
    for (var i=0;i<btns.length;i++) btns[i].disabled=true;
    if (k===Q.a){
      st.armed[j]=true; btns[k].className='opt right'; v.textContent='CORRECT. JUMP READY.';
      setTimeout(function(){ if (st.active===j&&st.mode==='run'){ st.active=-1; idle(j<2?'WALL CLEARED. KEEP RUNNING…':'ALL CLEAR. RUN FOR MAIN!'); } },1300);
    } else {
      st.doomed[j]=true; btns[k].className='opt wrong'; v.textContent='WRONG. BRACE FOR IMPACT…';
    }
  }

  function crash(why){
    st.mode='crash'; st.why=why; saveHi(); draw();
    setTerm([['','$ git push origin main'],
             ['on',' ! [rejected]   main -> main (viva: '+(why==='wrong'?'wrong answer':'no answer')+' at fog wall '+(st.active+1)+')'],
             ['on','error: failed to push. Nothing left your machine.']]);
    idle('PUSH REJECTED.<br>PRESS SPACE TO TRY AGAIN.');
  }
  function finish(){
    st.mode='done'; saveHi(); draw();
    setTerm([['','$ git push origin main'],['on','viva ▸ 3/3 fog walls cleared · your answers were saved for the team'],['on','   a1b2c3d..e4f5a6b  main -> main']]);
    idle('PUSHED TO MAIN.<br>PRESS SPACE TO PLAY AGAIN.');
  }
  function saveHi(){ if (score()>hi){ hi=score(); try{ localStorage.setItem('vivaHi',hi); }catch(e){} } }

  // ---------- draw ----------
  function pad(n){ return ('0000'+n).slice(-5); }
  function text(s,x,y,size,align){ ctx.fillStyle=INK; ctx.font=size+'px '+FONT; ctx.textAlign=align||'left'; ctx.fillText(s,x,y); }

  function restartIcon(cx,cy){
    // simple pixel circular arrow
    var R=["..#####..",".##...##.","##.....##","#.......#","#.......#","##.....##",".##...###","..#####.."];
    sprite(R,cx-13,cy-12,3);
    sprite(["####",".###","..##"],cx+6,cy-18,3);
  }

  function draw(){
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
    st.clouds.forEach(function(c){ sprite(CLOUD,c.x,c.y,3); });

    // score
    text('HI '+pad(hi)+'  '+pad(score()), W-8, 24, 12, 'right');

    // ground: line + pebbles
    ctx.fillStyle=INK; ctx.fillRect(0,GROUND,W,2);
    var off=st.world%60;
    for (var i=0;i<W/60+2;i++){ ctx.fillRect(i*60-off+8,GROUND+8,6,2); ctx.fillRect(i*60-off+34,GROUND+14,3,2); ctx.fillRect(i*60-off+48,GROUND+6,2,2); }

    // fog walls
    for (var j=0;j<3;j++){
      var sx=wallX(j)+10;
      if (sx<-60||sx>W+60||st.gone[j]>=1) continue;
      sprite(FOG,sx,GROUND-FOG.length*PS,PS,st.armed[j]);
      if (!st.armed[j]) text('?', sx+24, GROUND-14, 12, 'center');
    }

    // finish flag
    var fx=FINISH-st.world+PX+30;
    if (fx<W+60){ sprite(FLAG,fx,GROUND-FLAG.length*PS,PS); text('MAIN',fx+21,GROUND-FLAG.length*PS+11,8,'center'); }

    // player
    var dead=st.mode==='crash', by=GROUND-(BOX.length+2)*PS-st.y;
    sprite(dead?BOX_DEAD:BOX, PX, by, PS);
    var legs = st.y>0||dead ? LEGS[2] : (st.mode==='run' ? LEGS[Math.floor(st.frame/5)%2] : LEGS[2]);
    sprite(legs, PX, by+BOX.length*PS, PS);

    if (st.mode==='ready') text('PRESS SPACE TO PUSH', W/2, 92, 14, 'center');
    if (st.mode==='crash'){ text('P U S H   R E J E C T E D', W/2, 74, 16, 'center'); restartIcon(W/2, 112); }
    if (st.mode==='done'){ text('P U S H E D', W/2, 74, 16, 'center'); restartIcon(W/2, 112); }
  }

  document.addEventListener('keydown', function(e){
    if (e.code==='Space'||e.key==='ArrowUp'){ e.preventDefault(); if (st.mode!=='run') start(); }
    if (st.mode==='run'&&st.active>=0&&(e.key==='1'||e.key==='2'||e.key==='3')) answer(+e.key-1);
  });
  cv.addEventListener('pointerdown', function(){ if (st.mode!=='run') start(); });

  reset();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
})();
</script>
</body>
</html>
