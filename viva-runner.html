<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viva Runner</title>
<style>
  :root{--bg:#F7F5EF;--ink:#2B2B2B;--muted:#6B6B6B;--amber:#E0A21B;--amber-soft:#FCEFD0;--green:#2E8B57;--red:#C8443A;--line:#DDD8CC}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:24px 16px}
  .wrap{width:100%;max-width:880px}
  .term{font-family:Menlo,Consolas,monospace;font-size:13px;background:#1E1E1E;color:#D4D4D4;border-radius:10px;padding:12px 14px;line-height:1.6;margin-bottom:16px;min-height:66px}
  .term .g{color:#8FD18F}.term .a{color:#F2C14E}.term .r{color:#F08080}
  .hud{display:flex;justify-content:space-between;align-items:center;font-family:Menlo,Consolas,monospace;font-size:13px;color:var(--muted);margin-bottom:6px}
  .pips{display:flex;gap:6px;align-items:center}
  .pip{width:14px;height:14px;border:2px solid var(--ink);border-radius:3px}
  .pip.on{background:var(--ink)}

  /* question panel sits above the track, game keeps running underneath */
  .qpanel{min-height:178px;margin-bottom:10px}
  .card{background:#fff;border:2px solid var(--ink);border-radius:12px;box-shadow:4px 4px 0 var(--ink);padding:14px 16px}
  .card.idle{background:transparent;border-style:dashed;box-shadow:none;color:var(--muted);display:flex;align-items:center;justify-content:center;min-height:168px;text-align:center;line-height:1.5}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
  .tag{font-family:Menlo,Consolas,monospace;font-size:11px;font-weight:700;letter-spacing:.06em;background:var(--amber-soft);color:#7A5300;border:1.5px solid var(--amber);border-radius:999px;padding:2px 8px}
  .bar{flex:1 1 auto;max-width:220px;height:8px;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--ink)}
  .q{font-size:16px;font-weight:700;line-height:1.35;margin:0 0 8px}
  code{font-family:Menlo,Consolas,monospace;font-size:12px;background:var(--amber-soft);padding:1px 5px;border-radius:4px}
  .opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
  .opt{font:inherit;font-size:14px;text-align:left;min-height:44px;padding:8px 10px;border:2px solid var(--ink);border-radius:10px;background:#fff;cursor:pointer;display:flex;gap:8px;align-items:center}
  .opt:hover{background:#F3F1EA}
  .opt:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
  .opt kbd{font-family:Menlo,Consolas,monospace;font-size:12px;border:1.5px solid var(--ink);border-radius:4px;padding:0 6px}
  .opt.right{background:var(--green);border-color:var(--green);color:#fff}
  .opt.right kbd{border-color:#fff}
  .opt.wrong{background:var(--red);border-color:var(--red);color:#fff}
  .opt.wrong kbd{border-color:#fff}
  .opt:disabled{cursor:default}
  .verdict{margin-top:8px;font-weight:700;font-size:14px;min-height:20px}
  .verdict.ok{color:var(--green)} .verdict.bad{color:var(--red)}
  @media (max-width:600px){.opts{grid-template-columns:1fr}}

  .stage{position:relative;width:100%;border-bottom:2px solid var(--ink)}
  canvas{display:block;width:100%;height:auto;cursor:pointer}
  .foot{margin-top:12px;font-size:12px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="term" id="term"></div>

  <div class="hud">
    <span>VIVA RUNNER · <span id="score">00000</span></span>
    <span class="pips">fog walls <span class="pip" id="p0"></span><span class="pip" id="p1"></span><span class="pip" id="p2"></span></span>
  </div>

  <div class="qpanel" id="qpanel"></div>

  <div class="stage">
    <canvas id="c" width="880" height="240" aria-label="Viva Runner game"></canvas>
  </div>
  <div class="foot">Space or click to start · 1, 2 or 3 to answer · get one right and you jump; get one wrong and the push is rejected</div>
</div>

<script>
(function(){
  var QUESTIONS = [
    { q: "The first attempt charges the card, then times out. What happens on the retry?",
      code: "chargeCard() → then ledger.seen()",
      opts: ["The card gets charged twice", "The check blocks the retry", "The webhook gives up"], a: 0 },
    { q: "The agent wrapped the charge in a 5s timeout. When it fires, what happens at the bank?",
      code: "withTimeout(chargeCard(...), 5_000)",
      opts: ["The charge is cancelled", "The charge might still go through", "The charge is refunded"], a: 1 },
    { q: "MAX_RETRIES is 3. What is the most times this can call chargeCard?",
      code: "for (attempt = 1; attempt <= MAX_RETRIES; attempt++)",
      opts: ["2", "4", "3"], a: 2 }
  ];

  var cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var W = cv.width, H = cv.height, GROUND = 200, PX = 90;
  var WALLS = [1100, 2300, 3500], FINISH = 4300, ASK_AT = 760, WALL_W = 70;
  var FAST = 4.6, SLOW = 1.15;
  var st, last;

  var term = document.getElementById('term');
  function setTerm(lines){ term.innerHTML = lines.map(function(l){ return '<div class="'+l[0]+'">'+l[1]+'</div>'; }).join(''); }

  function reset(){
    st = { mode:'ready', world:0, y:0, vy:0, frame:0, speed:FAST,
           asked:[false,false,false], armed:[false,false,false], doomed:[false,false,false], fade:[1,1,1],
           active:-1, why:'', clouds:[{x:200,y:50},{x:520,y:80},{x:780,y:40}] };
    for (var i=0;i<3;i++) document.getElementById('p'+i).className='pip';
    setTerm([['', '<span class="g">$</span> git push origin main'],
             ['a', 'viva ▸ the agent made 3 changes you never asked for. Explain them or this push goes nowhere.']]);
    idlePanel('Your commit is running for <b>main</b>. Three fog walls are in the way.<br>Answer each question before you reach its wall. Get it right and you jump it. Get it wrong and you crash.');
    draw();
  }

  function idlePanel(html){ document.getElementById('qpanel').innerHTML = '<div class="card idle">'+html+'</div>'; }

  function start(){
    if (st.mode==='crash' || st.mode==='done'){ reset(); }
    if (st.mode!=='ready') return;
    st.mode='run'; last=performance.now(); requestAnimationFrame(loop);
  }

  function loop(t){
    var dt = Math.min(2.5, (t-last)/16.67); last = t;
    update(dt); draw();
    if (st.mode==='run') requestAnimationFrame(loop);
  }

  function wallX(j){ return WALLS[j]-st.world+PX; }

  function update(dt){
    st.frame += dt;
    // slow motion while a question is waiting for an answer
    var target = (st.active>=0 && !st.armed[st.active] && !st.doomed[st.active]) ? SLOW : FAST;
    if (st.active>=0 && st.doomed[st.active]) target = FAST*1.4; // wrong: you charge straight into it
    st.speed += (target-st.speed)*Math.min(1,0.12*dt);
    st.world += st.speed*dt;

    if (st.vy!==0 || st.y>0){ st.y += st.vy*dt; st.vy -= 0.55*dt; if (st.y<=0){ st.y=0; st.vy=0; } }
    for (var i=0;i<3;i++){ if (st.armed[i] && st.fade[i]>0 && wallX(i)<PX) st.fade[i]=Math.max(0, st.fade[i]-0.05*dt); }
    st.clouds.forEach(function(c){ c.x -= 0.3*st.speed*dt; if (c.x<-60) c.x = W+Math.random()*120; });
    document.getElementById('score').textContent = ('0000'+Math.floor(st.world/10)).slice(-5);

    for (var j=0;j<3;j++){
      var gap = wallX(j)-PX;
      if (!st.asked[j] && gap < ASK_AT){ ask(j); }
      if (st.active===j) updateBar(gap);
      if (gap < 34 && gap > -WALL_W){
        if (st.armed[j]){ if (st.y===0 && gap>0) st.vy = 12.5; }
        else if (st.y < 80){ crash(st.doomed[j] ? 'wrong' : 'slow'); return; }
      }
    }
    if (FINISH-st.world < 6){ finish(); }
  }

  function ask(j){
    st.asked[j]=true; st.active=j;
    var Q=QUESTIONS[j];
    var html = '<div class="card"><div class="row"><span class="tag">FOG WALL '+(j+1)+'/3 · THE AGENT CHANGED THIS SILENTLY</span><span class="bar"><i id="bar" style="width:100%"></i></span></div>'+
      '<p class="q"></p><code></code><div class="opts" id="opts"></div><div class="verdict" id="verdict"></div></div>';
    var p=document.getElementById('qpanel'); p.innerHTML=html;
    p.querySelector('.q').textContent=Q.q; p.querySelector('code').textContent=Q.code;
    var box=document.getElementById('opts');
    Q.opts.forEach(function(o,k){
      var b=document.createElement('button'); b.className='opt'; b.type='button';
      b.innerHTML='<kbd>'+(k+1)+'</kbd><span></span>'; b.lastChild.textContent=o;
      b.onclick=function(){ answer(k); }; box.appendChild(b);
    });
  }

  function updateBar(gap){ var b=document.getElementById('bar'); if (b) b.style.width = Math.max(0, Math.min(100, (gap-34)/(ASK_AT-34)*100))+'%'; }

  function answer(k){
    var j=st.active; if (j<0 || st.mode!=='run' || st.armed[j] || st.doomed[j]) return;
    var Q=QUESTIONS[j], btns=document.getElementById('opts').children, v=document.getElementById('verdict');
    for (var i=0;i<btns.length;i++) btns[i].disabled=true;
    if (k===Q.a){
      st.armed[j]=true; btns[k].className='opt right';
      document.getElementById('p'+j).className='pip on';
      v.className='verdict ok'; v.textContent='✓ Correct. Jump ready.';
      setTimeout(function(){ if (st.active===j && st.mode==='run'){ st.active=-1; idlePanel(j<2 ? 'Wall cleared. Keep running…' : 'All walls cleared. Run for main!'); } }, 1400);
    } else {
      st.doomed[j]=true; btns[k].className='opt wrong';
      v.className='verdict bad'; v.textContent='✗ Wrong. Brace for impact…';
    }
  }

  function crash(why){
    st.mode='crash'; st.why=why; draw();
    setTerm([['', '<span class="g">$</span> git push origin main'],
             ['r', ' ! [rejected]   main -> main (viva: '+(why==='wrong'?'wrong answer on fog wall '+(st.active+1):'no answer before fog wall '+(st.active+1))+')'],
             ['r', 'error: failed to push. Nothing was pushed. Explain the change and try again.']]);
    idlePanel('<span style="color:#C8443A;font-weight:700">PUSH REJECTED.</span>&nbsp;Press Space or click the track to try again from the start.');
  }

  function finish(){
    st.mode='done'; draw();
    setTerm([['', '<span class="g">$</span> git push origin main'],
             ['g', 'viva ▸ 3/3 fog walls cleared. Your answers were saved for the team.'],
             ['g', '   a1b2c3d..e4f5a6b  main -> main ✓']]);
    idlePanel('<b>Pushed to main ✓</b>&nbsp;The fog over handleWebhook is cleared. Press Space to play again.');
  }

  // ---------- drawing ----------
  var INK='#2B2B2B';
  function rect(x,y,w,h,c){ ctx.fillStyle=c||INK; ctx.fillRect(Math.round(x),Math.round(y),w,h); }

  function drawBox(x,y,f,dead){
    var by = GROUND-34-y;
    rect(x,by,30,26,'#C99A5B'); rect(x,by,30,3,INK); rect(x,by+23,30,3,INK); rect(x,by,3,26,INK); rect(x+27,by,3,26,INK);
    rect(x+13,by,4,26,'#E8D3A8');
    if (dead){ // X eyes
      [[7,8],[19,8]].forEach(function(e){ rect(x+e[0],by+e[1],2,2); rect(x+e[0]+4,by+e[1],2,2); rect(x+e[0]+2,by+e[1]+2,2,2); rect(x+e[0],by+e[1]+4,2,2); rect(x+e[0]+4,by+e[1]+4,2,2); });
      rect(x+4,by+26,4,8); rect(x+22,by+26,4,8);
      return;
    }
    rect(x+19,by+8,4,5); rect(x+7,by+8,4,5);
    rect(x+20,by+8,2,2,'#fff'); rect(x+8,by+8,2,2,'#fff');
    var leg = Math.floor(f/5)%2;
    if (y>0){ rect(x+6,by+26,4,6); rect(x+20,by+26,4,6); }
    else if (leg){ rect(x+4,by+26,4,8); rect(x+22,by+26,4,4); }
    else { rect(x+4,by+26,4,4); rect(x+22,by+26,4,8); }
  }

  function drawFog(x,alpha,armed){
    if (alpha<=0) return;
    ctx.globalAlpha=alpha;
    var b=GROUND;
    var puffs=[[0,-16,16],[22,-30,20],[44,-18,17],[12,-56,17],[36,-62,18],[-4,-38,13],[54,-44,14],[24,-84,14]];
    var edge = armed ? '#2E8B57' : '#E0A21B';
    puffs.forEach(function(p){ ctx.fillStyle=edge; ctx.beginPath(); ctx.arc(x+p[0],b+p[1],p[2]+2,0,Math.PI*2); ctx.fill(); });
    puffs.forEach(function(p){ ctx.fillStyle='#BDB8AC'; ctx.beginPath(); ctx.arc(x+p[0],b+p[1],p[2],0,Math.PI*2); ctx.fill(); });
    ctx.fillStyle=INK; ctx.font='bold 24px Menlo, Consolas, monospace'; ctx.textAlign='center';
    ctx.fillText(armed ? '✓' : '?', x+24, b-40);
    ctx.globalAlpha=1;
  }

  function drawFlag(x){
    rect(x,GROUND-90,4,90);
    rect(x+4,GROUND-90,44,24,'#2E8B57');
    ctx.fillStyle='#fff'; ctx.font='bold 12px Menlo, Consolas, monospace'; ctx.textAlign='left'; ctx.fillText('main',x+10,GROUND-73);
  }

  function centerText(big, small){
    ctx.fillStyle=INK; ctx.textAlign='center';
    ctx.font='bold 26px Menlo, Consolas, monospace'; ctx.fillText(big, W/2, 70);
    ctx.font='14px Menlo, Consolas, monospace'; ctx.fillText(small, W/2, 98);
  }

  function draw(){
    ctx.fillStyle='#F7F5EF'; ctx.fillRect(0,0,W,H);
    st.clouds.forEach(function(c){ rect(c.x,c.y,40,6,'#E2DED3'); rect(c.x+8,c.y-6,22,6,'#E2DED3'); });
    var off = st.world % 40;
    for (var i=0;i<W/40+2;i++){ rect(i*40-off+6, GROUND+8, 8, 2, '#B5AFA2'); rect(i*40-off+24, GROUND+16, 4, 2, '#B5AFA2'); }
    for (var j=0;j<3;j++){ var sx=wallX(j)+14; if (sx>-90 && sx<W+90) drawFog(sx, st.fade[j], st.armed[j]); }
    var fx=FINISH-st.world+PX+30; if (fx<W+60) drawFlag(fx);
    drawBox(PX, st.y, st.mode==='run'?st.frame:0, st.mode==='crash');
    if (st.mode==='ready') centerText('PRESS SPACE TO PUSH', 'answer right to jump · answer wrong and you crash');
    if (st.mode==='crash') centerText('P U S H   R E J E C T E D', st.why==='wrong' ? 'wrong answer · press space to retry' : 'too slow · press space to retry');
    if (st.mode==='done') centerText('P U S H E D', 'press space to play again');
  }

  // ---------- input ----------
  document.addEventListener('keydown', function(e){
    if (e.code==='Space' || e.key==='ArrowUp'){
      if (st.mode!=='run'){ e.preventDefault(); start(); }
      else e.preventDefault();
    }
    if (st.mode==='run' && st.active>=0 && (e.key==='1'||e.key==='2'||e.key==='3')) answer(+e.key-1);
  });
  cv.addEventListener('pointerdown', function(){ if (st.mode!=='run') start(); });

  reset();
})();
</script>
</body>
</html>
